name: Build Dentist APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest=manifest.json --no-prompt || true
          bubblewrap build --no-prompt --skipFirstRunCheck
      - uses: actions/upload-artifact@v4
        with:
          name: Dentist-App
          path: ./*.apk
