name: Build Dentist APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        run: |
          # دروستکردنی ئەپەکە بەبێ پرسیارکردن
          bubblewrap init --manifest=manifest.json --no-prompt || true
          bubblewrap build --no-prompt --skipFirstRunCheck

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dentist-App
          path: ./*.apk
