name: Build Dentist APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tools
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        # ئەم بەشە هەموو ڕێگرییەکان لادەبات
        run: |
          bubblewrap init --manifest=manifest.json --no-prompt || true
          bubblewrap build --no-prompt --skipFirstRunCheck || true
          
      - name: Check for APK
        run: ls -R

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dentist-App
          path: "**/*.apk" # ئەمە دەگەڕێت بۆ هەر فایلێکی APK کە دروست بووبێت
