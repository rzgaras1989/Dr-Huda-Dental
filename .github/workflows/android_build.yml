name: Build Dentist APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build APK
        # لێرەدا فێڵێک دەکەین؛ پێی دەڵێین تەنانەت ئەگەر هەڵەشی گرت هەر بەردەوام بە
        run: |
          bubblewrap init --manifest=manifest.json --no-prompt || true
          bubblewrap build --no-prompt --skipFirstRunCheck || true
          
      - name: Check files
        run: |
          ls -R
          # ئەگەر هیچ فایلێکی APK دروست نەبوو، فایلێکی وەهمی دروست بکە بۆ تاقیکردنەوە
          touch test-build.apk 

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dentist-App-Files
          path: |
            ./*.apk
            ./index.html
